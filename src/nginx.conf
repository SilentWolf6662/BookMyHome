server {
	listen 8001;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Docker's internal DNS, so nginx can start even if the api container is not up yet
	resolver 127.0.0.11 valid=30s;

	location /api/ {
		set $api http://api:8002;
		proxy_pass $api;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		# SPA fallback, so Blazor routes like /bookings reload correctly
		try_files $uri $uri/ /index.html;
	}
}
